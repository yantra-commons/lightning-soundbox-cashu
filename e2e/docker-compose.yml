name: sbcashu-e2e
services:
  bitcoind:
    image: btcpayserver/bitcoin:29.1
    environment:
      BITCOIN_NETWORK: regtest
      BITCOIN_WALLETDIR: "/data/wallets"
      BITCOIN_EXTRA_ARGS: |-
        rpcuser=rpc
        rpcpassword=rpc
        rpcport=43782
        rpcbind=0.0.0.0:43782
        rpcallowip=0.0.0.0/0
        port=39388
        whitelist=0.0.0.0/0
        zmqpubrawblock=tcp://0.0.0.0:28332
        zmqpubrawtx=tcp://0.0.0.0:28333
        fallbackfee=0.0002
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:5206:5432"]
  nbxplorer:
    image: nicolasdorier/nbxplorer:2.6.23
    environment:
      NBXPLORER_NETWORK: regtest
      NBXPLORER_CHAINS: "btc"
      NBXPLORER_BTCRPCURL: http://bitcoind:43782/
      NBXPLORER_BTCNODEENDPOINT: bitcoind:39388
      NBXPLORER_BTCRPCUSER: rpc
      NBXPLORER_BTCRPCPASSWORD: rpc
      NBXPLORER_BIND: 0.0.0.0:32838
      NBXPLORER_POSTGRES: User ID=postgres;Host=postgres;Port=5432;Database=nbxplorer
      NBXPLORER_EXPOSERPC: 1
      NBXPLORER_NOAUTH: 1
    depends_on: [bitcoind, postgres]
  merchant_lnd:
    image: btcpayserver/lnd:v0.19.3-beta
    environment: &lndenv
      LND_CHAIN: "btc"
      LND_ENVIRONMENT: "regtest"
      LND_EXPLORERURL: "http://nbxplorer:32838/"
      LND_REST_LISTEN_HOST: http://merchant_lnd:8080
      LND_EXTRA_ARGS: |
        restlisten=merchant_lnd:8080
        rpclisten=127.0.0.1:10008
        bitcoin.node=bitcoind
        bitcoind.rpchost=bitcoind:43782
        bitcoind.rpcuser=rpc
        bitcoind.rpcpass=rpc
        bitcoind.zmqpubrawblock=tcp://bitcoind:28332
        bitcoind.zmqpubrawtx=tcp://bitcoind:28333
        externalip=merchant_lnd:9735
        bitcoin.defaultchanconfs=1
        no-macaroons=1
        no-rest-tls=1
        trickledelay=1000
    ports: ["127.0.0.1:5204:8080"]
    depends_on: [bitcoind, nbxplorer]
  mint_lnd:
    image: btcpayserver/lnd:v0.19.3-beta
    environment:
      LND_CHAIN: "btc"
      LND_ENVIRONMENT: "regtest"
      LND_EXPLORERURL: "http://nbxplorer:32838/"
      LND_REST_LISTEN_HOST: http://mint_lnd:8080
      LND_EXTRA_ARGS: |
        restlisten=mint_lnd:8080
        rpclisten=127.0.0.1:10008
        bitcoin.node=bitcoind
        bitcoind.rpchost=bitcoind:43782
        bitcoind.rpcuser=rpc
        bitcoind.rpcpass=rpc
        bitcoind.zmqpubrawblock=tcp://bitcoind:28332
        bitcoind.zmqpubrawtx=tcp://bitcoind:28333
        externalip=mint_lnd:9735
        bitcoin.defaultchanconfs=1
        no-macaroons=1
        no-rest-tls=1
        trickledelay=1000
    ports: ["127.0.0.1:5205:8080"]
    depends_on: [bitcoind, nbxplorer]
  nutshell:
    image: cashubtc/nutshell:0.21.0
    command: ["poetry", "run", "mint"]
    environment:
      MINT_LISTEN_HOST: 0.0.0.0
      MINT_LISTEN_PORT: 3338
      MINT_PRIVATE_KEY: e2e-test-only-not-a-real-key
      MINT_INPUT_FEE_PPK: 100
      MINT_DATABASE: data/mint
      MINT_BACKEND_BOLT11_SAT: LndRestWallet
      MINT_LND_REST_ENDPOINT: http://mint_lnd:8080
      MINT_LND_REST_MACAROON: "00"
      MINT_LND_REST_CERT_VERIFY: "false"
    ports: ["127.0.0.1:5203:3338"]
    depends_on: [mint_lnd]
  btcpay:
    image: btcpayserver/btcpayserver:2.4.7
    environment:
      BTCPAY_NETWORK: regtest
      BTCPAY_BIND: 0.0.0.0:49392
      BTCPAY_POSTGRES: User ID=postgres;Host=postgres;Port=5432;Database=btcpay
      BTCPAY_CHAINS: btc
      BTCPAY_BTCEXPLORERURL: http://nbxplorer:32838/
      BTCPAY_PLUGINDIR: /plugins
      BTCPAY_ALLOW-ADMIN-REGISTRATION: "true"
      BTCPAY_DISABLE-REGISTRATION: "false"
    volumes:
      - ./plugins:/plugins
    ports: ["127.0.0.1:5202:49392"]
    depends_on: [postgres, nbxplorer]
